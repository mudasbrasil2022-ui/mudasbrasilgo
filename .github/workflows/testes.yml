name: Verificar integração FruitfyPay
on:
  push:
    branches: [main, integracao-fruitfypay-segura]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar validação de pedidos (sem cobrança real)
        run: node --test tests/*.test.mjs
      - name: Conferir arquivos do site
        run: |
          test -s index.html
          test -s netlify.toml
          test -s netlify/functions/create-fruitfy-pix.mjs
          test -d assets
